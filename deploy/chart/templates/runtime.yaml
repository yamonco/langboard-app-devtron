{{- $hostOrigin := required "hostOrigin must be the Langboard HTTPS origin" .Values.hostOrigin -}}
{{- if not (regexMatch "^https://[^/?#@]+$" $hostOrigin) -}}
{{- fail "hostOrigin must be an HTTPS origin without a trailing slash" -}}
{{- end -}}
{{- if and .Values.imageSourceRevision (not (regexMatch "^[a-f0-9]{40}$" .Values.imageSourceRevision)) -}}
{{- fail "imageSourceRevision must be the image source commit" -}}
{{- end -}}
{{- $publicUrl := required "publicUrl must be the panel HTTPS origin" .Values.publicUrl -}}
{{- if not (regexMatch "^https://[^/?#@]+$" $publicUrl) -}}
{{- fail "publicUrl must be an HTTPS origin without a trailing slash" -}}
{{- end -}}
{{- if not (regexMatch "^.+@sha256:[a-f0-9]{64}$" .Values.image) -}}
{{- fail "image must be the verified immutable digest reference" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: &labels
    app.kubernetes.io/name: langboard-app-devtron
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
      {{- with .Values.imageSourceRevision }}
      annotations:
        org.opencontainers.image.revision: {{ . | quote }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: panel
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: HOST_ORIGIN
              value: {{ $hostOrigin | quote }}
            - name: PUBLIC_URL
              value: {{ $publicUrl | quote }}
          ports:
            - name: http
              containerPort: 8780
          readinessProbe:
            httpGet:
              path: /manifest.json
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /manifest.json
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: langboard-app-devtron
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: langboard-app-devtron
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8780
      targetPort: http
