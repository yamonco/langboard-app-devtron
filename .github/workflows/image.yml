name: Build image
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: project-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  request-image:
    uses: yamonco/yamon-gitops/.github/workflows/remote-project-image.yml@04f293ea6675e05dfbad9aff5fe5655bc2266e80
    with:
      profile: default
