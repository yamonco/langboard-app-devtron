name: Check App
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-fund --no-audit
      - run: npm test
      - run: npm run manifest
      - name: Package portable signal publisher with the native SDK
        run: node package.mjs --publish-signals dist/langboard-app-devtron.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: devtron-publishing-package
          path: dist/langboard-app-devtron.zip
          if-no-files-found: error
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - name: Validate tenant chart and rejected bindings
        shell: bash
        run: |
          set -euo pipefail
          helm lint deploy/chart -f deploy/examples/values.yaml
          helm template devtron-panel deploy/chart \
            --namespace langboard-app-devtron -f deploy/examples/values.yaml \
            > "$RUNNER_TEMP/devtron-panel.yaml"
          if helm template devtron-panel deploy/chart -f deploy/examples/values.yaml --set publicUrl= > /dev/null 2>&1; then
            echo 'Missing route binding was accepted' >&2
            exit 1
          fi
          if helm template devtron-panel deploy/chart \
            -f deploy/examples/values.yaml --set image=unsafe:latest > /dev/null 2>&1; then
            echo 'Mutable image was accepted' >&2
            exit 1
          fi
          if helm template devtron-panel deploy/chart \
            -f deploy/examples/values.yaml --set hostOrigin=https://host.example/path > /dev/null 2>&1; then
            echo 'Invalid host origin was accepted' >&2
            exit 1
          fi
