name: Check App
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-fund --no-audit
      - run: npm test
      - run: npm run manifest
